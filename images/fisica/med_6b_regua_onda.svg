<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240">
  <rect width="300" height="240" rx="18" fill="#FAF8F5"/>
  <!-- Yellow Ruler at top measuring wavelength lambda -->
  <rect x="45" y="45" width="210" height="36" rx="4" fill="#FACC15" stroke="#B45309" stroke-width="3"/>
  <line x1="75" y1="45" x2="75" y2="62" stroke="#78350F" stroke-width="3"/>
  <line x1="112" y1="45" x2="112" y2="58" stroke="#78350F" stroke-width="3"/>
  <line x1="150" y1="45" x2="150" y2="62" stroke="#78350F" stroke-width="3"/>
  <line x1="187" y1="45" x2="187" y2="58" stroke="#78350F" stroke-width="3"/>
  <line x1="225" y1="45" x2="225" y2="62" stroke="#78350F" stroke-width="3"/>
  <!-- Wave underneath matching ruler ticks -->
  <path d="M 35 160 C 55 95, 95 95, 112 160 C 130 225, 170 225, 187 160 C 205 95, 245 95, 265 160" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
  <text x="150" y="132" text-anchor="middle" fill="#EA580C" font-size="30" font-weight="bold">λ</text>
</svg>