  <path d="M90 142 Q120 110 148 112" fill="none" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>
  <path d="M102 150 Q130 125 152 128" fill="none" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>
</svg>