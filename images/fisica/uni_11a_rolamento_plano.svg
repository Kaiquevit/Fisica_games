<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Inclined Plane Triangle -->
  <polygon points="25,245 275,245 25,115" fill="#E2E8F0" stroke="#475569" stroke-width="5" stroke-linejoin="round"/>
  <!-- Rolling Wheel on incline -->
  <g transform="translate(135, 118)">
    <circle cx="0" cy="0" r="44" fill="#DBEAFE" stroke="#2563EB" stroke-width="6"/>
    <circle cx="0" cy="0" r="8" fill="#1E293B"/>
    <!-- Angular velocity omega arc -->
    <path d="M-15 -25 A28 28 0 0 1 25 -10" fill="none" stroke="#EA580C" stroke-width="5" stroke-linecap="round"/>
    <polygon points="28,-4 16,-12 29,-17" fill="#EA580C"/>
    <!-- Center of mass velocity vector v_CM parallel to slope -->
    <path d="M0 0 L68 35 M54 37 L70 36 L61 23" stroke="#16A34A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>