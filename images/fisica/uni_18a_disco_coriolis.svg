<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240">
  <rect width="300" height="240" rx="18" fill="#FAF8F5"/>
  <!-- Rotating Frame / Carousel deflecting ball trajectory (Coriolis Effect) -->
  <circle cx="150" cy="120" r="85" fill="#EFF6FF" stroke="#2563EB" stroke-width="5"/>
  <!-- Intended straight path dashed -->
  <line x1="150" y1="120" x2="150" y2="38" stroke="#94A3B8" stroke-width="4" stroke-dasharray="6,6"/>
  <!-- Curved deflected Coriolis trajectory -->
  <path d="M150 120 Q155 75 205 58" fill="none" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
  <polygon points="212,56 196,52 202,66" fill="#EF4444"/>
  <circle cx="150" cy="120" r="8" fill="#1E293B"/>
</svg>