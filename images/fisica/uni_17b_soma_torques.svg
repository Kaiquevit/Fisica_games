  <rect x="40" y="128" width="220" height="65" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="4"/>
  <text x="150" y="171" text-anchor="middle" fill="#9A3412" font-size="28" font-weight="bold">Σ τ⃗ = 0</text>
</svg>