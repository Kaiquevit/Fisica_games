<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Sky backdrop -->
  <circle cx="150" cy="150" r="122" fill="#E0F2FE"/>
  <!-- Roller Coaster Track Curve and Support Pillars -->
  <line x1="75" y1="128" x2="75" y2="255" stroke="#94A3B8" stroke-width="5"/>
  <line x1="115" y1="115" x2="115" y2="255" stroke="#94A3B8" stroke-width="5"/>
  <line x1="155" y1="155" x2="155" y2="255" stroke="#94A3B8" stroke-width="5"/>
  <line x1="205" y1="220" x2="205" y2="255" stroke="#94A3B8" stroke-width="5"/>
  <!-- Track rail curve from high peak down to valley -->
  <path d="M30 175 Q95 75 145 140 T265 225" fill="none" stroke="#0284C7" stroke-width="8" stroke-linecap="round"/>
  <!-- Height indicator arrow (h) on left -->
  <path d="M48 112 L48 245 M40 122 L48 110 L56 122 M40 235 L48 247 L56 235" stroke="#F97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Coaster Cart perched right at the top peak -->
  <g transform="translate(86, 82) rotate(12)">
    <rect x="0" y="0" width="56" height="26" rx="8" fill="#EF4444" stroke="#991B1B" stroke-width="3"/>
    <circle cx="14" cy="28" r="7" fill="#1E293B"/>
    <circle cx="42" cy="28" r="7" fill="#1E293B"/>
  </g>
  <!-- Downward motion arrow along slope -->
  <path d="M162 122 Q195 155 225 185 M210 185 L227 187 L223 170" stroke="#22C55E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>