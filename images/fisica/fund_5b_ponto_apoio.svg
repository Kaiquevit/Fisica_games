<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Base platform -->
  <rect x="45" y="235" width="210" height="14" rx="7" fill="#475569"/>
  <!-- Horizontal balance bar -->
  <rect x="40" y="132" width="220" height="16" rx="8" fill="#0284C7" stroke="#0369A1" stroke-width="3"/>
  <!-- Central Fulcrum Triangle (Ponto de Apoio) highlighted -->
  <polygon points="150,148 100,235 200,235" fill="#F97316" stroke="#C2410C" stroke-width="5" stroke-linejoin="round"/>
  <!-- Pivot circle at apex -->
  <circle cx="150" cy="148" r="10" fill="#FEF08A" stroke="#B45309" stroke-width="4"/>
  <!-- Rotation equilibrium arrows on left & right -->
  <path d="M70 115 A28 28 0 0 1 105 95" fill="none" stroke="#22C55E" stroke-width="5" stroke-linecap="round"/>
  <polygon points="105,86 116,95 103,103" fill="#22C55E"/>
  <path d="M230 115 A28 28 0 0 0 195 95" fill="none" stroke="#22C55E" stroke-width="5" stroke-linecap="round"/>
  <polygon points="195,86 184,95 197,103" fill="#22C55E"/>
</svg>