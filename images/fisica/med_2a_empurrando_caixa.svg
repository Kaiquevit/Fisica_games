<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Floor -->
  <line x1="20" y1="230" x2="280" y2="230" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <!-- Heavy Wooden Crate -->
  <rect x="135" y="120" width="105" height="107" rx="6" fill="#D97706" stroke="#78350F" stroke-width="5"/>
  <line x1="135" y1="120" x2="240" y2="227" stroke="#92400E" stroke-width="4"/>
  <line x1="240" y1="120" x2="135" y2="227" stroke="#92400E" stroke-width="4"/>
  <!-- Person pushing crate -->
  <circle cx="72" cy="128" r="16" fill="#FDBA74"/>
  <!-- Leaning torso -->
  <line x1="75" y1="145" x2="95" y2="188" stroke="#2563EB" stroke-width="16" stroke-linecap="round"/>
  <!-- Arms pushing box -->
  <line x1="82" y1="155" x2="132" y2="155" stroke="#FDBA74" stroke-width="10" stroke-linecap="round"/>
  <!-- Legs bracing -->
  <line x1="95" y1="188" x2="62" y2="226" stroke="#1E3A8A" stroke-width="11" stroke-linecap="round"/>
  <line x1="95" y1="188" x2="112" y2="226" stroke="#1E3A8A" stroke-width="11" stroke-linecap="round"/>
  <!-- Applied Force Arrow (Green, pointing right) -->
  <path d="M145 85 L258 85 M242 72 L260 85 L242 98" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Friction Force Arrow at floor (Red, pointing left) -->
  <path d="M185 248 L115 248 M128 238 L113 248 L128 258" stroke="#DC2626" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>