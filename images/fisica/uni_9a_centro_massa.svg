<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- 3D Coordinate Axes -->
  <line x1="45" y1="245" x2="265" y2="245" stroke="#475569" stroke-width="4"/>
  <line x1="45" y1="245" x2="45" y2="40" stroke="#475569" stroke-width="4"/>
  <!-- Continuous Rigid Body Shape -->
  <path d="M95 110 C130 65, 225 75, 235 135 C245 195, 165 215, 115 185 C75 160, 70 140, 95 110 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="4"/>
  <!-- Differential mass element cube dm -->
  <rect x="185" y="105" width="22" height="22" fill="#F97316" stroke="#7C2D12" stroke-width="2"/>
  <!-- Center of Mass point CM -->
  <circle cx="152" cy="145" r="11" fill="#16A34A" stroke="#FFFFFF" stroke-width="3"/>
  <!-- Vector r_CM from origin to CM -->
  <path d="M45 245 L144 152 M130 154 L146 150 L141 165" stroke="#16A34A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Vector r from origin to dm -->
  <path d="M45 245 L184 125" stroke="#F97316" stroke-width="4" stroke-dasharray="6,5"/>
</svg>