<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Deep sky background -->
  <circle cx="150" cy="150" r="120" fill="#1E293B"/>
  <!-- Upward Reaction Vector Arrow (Green, left of rocket) -->
  <path d="M72 175 L72 65 M58 82 L72 63 L86 82" stroke="#22C55E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Downward Action Vector Arrow (Orange, right of exhaust) -->
  <path d="M228 155 L228 255 M214 238 L228 257 L242 238" stroke="#F97316" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Exhaust gas flames shooting down -->
  <path d="M125 185 Q150 265 175 185 Z" fill="#F97316"/>
  <path d="M135 185 Q150 240 165 185 Z" fill="#FACC15"/>
  <!-- Smoke clouds at bottom -->
  <circle cx="120" cy="248" r="20" fill="#E2E8F0"/>
  <circle cx="150" cy="255" r="24" fill="#F8FAFC"/>
  <circle cx="180" cy="248" r="20" fill="#E2E8F0"/>
  <!-- Rocket fins -->
  <polygon points="122,145 95,185 122,180" fill="#EF4444"/>
  <polygon points="178,145 205,185 178,180" fill="#EF4444"/>
  <!-- Rocket body -->
  <path d="M150 45 Q182 85 178 180 L122 180 Q118 85 150 45 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/>
  <!-- Rocket nose cone -->
  <path d="M150 45 Q168 68 172 88 L128 88 Q132 68 150 45 Z" fill="#EF4444"/>
  <!-- Porthole window -->
  <circle cx="150" cy="122" r="16" fill="#38BDF8" stroke="#475569" stroke-width="4"/>
</svg>