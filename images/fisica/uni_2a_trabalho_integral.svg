<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Shaded integral area under F(x) curve between x1 and x2 -->
  <path d="M 75 240 L 75 160 C 120 70, 180 85, 235 140 L 235 240 Z" fill="#93C5FD" opacity="0.65"/>
  <!-- Riemann integration strips -->
  <rect x="105" y="112" width="18" height="128" fill="#3B82F6" opacity="0.35"/>
  <rect x="145" y="96" width="18" height="144" fill="#2563EB" opacity="0.45"/>
  <rect x="185" y="108" width="18" height="132" fill="#3B82F6" opacity="0.35"/>
  <!-- Variable force curve F(x) -->
  <path d="M 55 190 C 105 60, 175 70, 255 160" fill="none" stroke="#1D4ED8" stroke-width="6" stroke-linecap="round"/>
  <!-- Dashed boundary lines at x1 and x2 -->
  <line x1="75" y1="160" x2="75" y2="240" stroke="#F97316" stroke-width="4" stroke-dasharray="6,5"/>
  <line x1="235" y1="140" x2="235" y2="240" stroke="#F97316" stroke-width="4" stroke-dasharray="6,5"/>
  <!-- Axes -->
  <line x1="40" y1="240" x2="272" y2="240" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
  <line x1="40" y1="240" x2="40" y2="35" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
  <polygon points="275,240 262,233 262,247" fill="#1E293B"/>
  <polygon points="40,32 33,45 47,45" fill="#1E293B"/>
</svg>