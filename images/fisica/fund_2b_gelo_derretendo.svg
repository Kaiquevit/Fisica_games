<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Warm sun rays top right -->
  <circle cx="235" cy="65" r="28" fill="#FACC15"/>
  <line x1="195" y1="65" x2="178" y2="65" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <line x1="205" y1="95" x2="190" y2="110" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <line x1="235" y1="105" x2="235" y2="122" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <!-- Water puddle -->
  <ellipse cx="150" cy="235" rx="105" ry="26" fill="#38BDF8"/>
  <ellipse cx="145" cy="232" rx="75" ry="15" fill="#7DD3FC"/>
  <!-- Ice cube 3D isometric -->
  <!-- Front-left face -->
  <polygon points="85,135 150,165 150,230 85,200" fill="#bae6fd" stroke="#0284c7" stroke-width="4" stroke-linejoin="round"/>
  <!-- Front-right face -->
  <polygon points="150,165 215,135 215,200 150,230" fill="#7dd3fc" stroke="#0284c7" stroke-width="4" stroke-linejoin="round"/>
  <!-- Top face -->
  <polygon points="85,135 150,105 215,135 150,165" fill="#e0f2fe" stroke="#0284c7" stroke-width="4" stroke-linejoin="round"/>
  <!-- Shine lines on ice cube -->
  <line x1="105" y1="160" x2="130" y2="195" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Melting water drops falling off the cube -->
  <path d="M80 185 Q72 200 80 207 Q88 200 80 185 Z" fill="#0284C7"/>
  <path d="M222 178 Q214 193 222 200 Q230 193 222 178 Z" fill="#0284C7"/>
  <path d="M168 212 Q160 227 168 234 Q176 227 168 212 Z" fill="#0284C7"/>
</svg>