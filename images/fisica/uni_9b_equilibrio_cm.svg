<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240">
  <rect width="300" height="240" rx="18" fill="#FAF8F5"/>
  <!-- Balanced system on Center of Mass fulcrum -->
  <polygon points="120,135 95,195 145,195" fill="#16A34A" stroke="#15803D" stroke-width="4"/>
  <rect x="45" y="123" width="210" height="12" rx="6" fill="#475569"/>
  <!-- Heavy mass M closer to CM -->
  <circle cx="80" cy="95" r="28" fill="#2563EB" stroke="#1E3A8A" stroke-width="4"/>
  <text x="80" y="104" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="bold">2m</text>
  <!-- Lighter mass m twice as far from CM -->
  <circle cx="205" cy="105" r="18" fill="#EA580C" stroke="#9A3412" stroke-width="4"/>
  <text x="205" y="112" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="bold">m</text>
  <text x="120" y="222" text-anchor="middle" fill="#15803D" font-size="22" font-weight="bold">CM</text>
</svg>