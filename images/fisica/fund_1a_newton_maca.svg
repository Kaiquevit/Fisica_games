<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Clean off-white background -->
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Soft sky circle -->
  <circle cx="150" cy="145" r="115" fill="#E0F2FE"/>
  <!-- Ground hill -->
  <path d="M25 235 Q150 205 275 235 L275 275 L25 275 Z" fill="#4ADE80"/>
  <!-- Tree trunk -->
  <path d="M85 130 L85 230 L115 230 L110 130 Z" fill="#854D0E"/>
  <path d="M105 150 L145 125 L140 115 L102 138 Z" fill="#854D0E"/>
  <!-- Tree foliage -->
  <circle cx="100" cy="95" r="48" fill="#22C55E"/>
  <circle cx="145" cy="105" r="40" fill="#16A34A"/>
  <circle cx="68" cy="112" r="35" fill="#15803D"/>
  <!-- Apples on tree -->
  <circle cx="75" cy="95" r="8" fill="#EF4444"/>
  <circle cx="120" cy="78" r="8" fill="#EF4444"/>
  <!-- Person sitting under tree (Newton) -->
  <!-- Legs -->
  <rect x="112" y="218" width="42" height="14" rx="7" fill="#1E3A8A"/>
  <!-- Coat/Body -->
  <path d="M98 182 Q122 182 128 225 L95 225 Z" fill="#7C2D12"/>
  <!-- Head -->
  <circle cx="112" cy="166" r="16" fill="#FDBA74"/>
  <!-- Long curly hair -->
  <path d="M95 162 Q90 180 100 185 Q96 155 112 150 Q128 155 125 182 Q132 172 126 158 Z" fill="#E2E8F0"/>
  <!-- Falling apple mid-air with motion lines -->
  <line x1="175" y1="125" x2="175" y2="148" stroke="#EF4444" stroke-width="3" stroke-linecap="round" stroke-dasharray="5,5"/>
  <line x1="185" y1="132" x2="185" y2="148" stroke="#F87171" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,4"/>
  <!-- Downward arrow next to apple -->
  <path d="M202 138 L202 172 M194 164 L202 174 L210 164" stroke="#DC2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Falling red apple -->
  <circle cx="175" cy="168" r="15" fill="#EF4444"/>
  <path d="M175 153 Q178 145 184 148" stroke="#15803D" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="182" cy="150" rx="6" ry="3" transform="rotate(-25 182 150)" fill="#22C55E"/>
</svg>