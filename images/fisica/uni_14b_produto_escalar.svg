<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240">
  <rect width="300" height="240" rx="18" fill="#FAF8F5"/>
  <!-- Instantaneous Power Scalar Product P = F . v -->
  <rect x="45" y="55" width="210" height="130" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="5"/>
  <text x="150" y="112" text-anchor="middle" fill="#9A3412" font-size="32" font-weight="bold">P = F⃗ · v⃗</text>
  <text x="150" y="155" text-anchor="middle" fill="#1E3A8A" font-size="22" font-weight="bold">F · v · cos(θ)</text>
</svg>