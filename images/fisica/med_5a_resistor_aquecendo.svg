<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Warm thermal glow halo around resistor -->
  <ellipse cx="150" cy="155" rx="115" ry="75" fill="#FEE2E2"/>
  <ellipse cx="150" cy="155" rx="88" ry="50" fill="#FECACA"/>
  <!-- Copper wire leads -->
  <line x1="20" y1="155" x2="280" y2="155" stroke="#64748B" stroke-width="10" stroke-linecap="round"/>
  <!-- Glowing Zig-Zag Resistor / Heating Coil -->
  <polyline points="65,155 82,115 108,195 135,115 162,195 188,115 215,195 232,155" fill="none" stroke="#EF4444" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="65,155 82,115 108,195 135,115 162,195 188,115 215,195 232,155" fill="none" stroke="#F97316" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rising Heat Waves (Joule Effect) -->
  <path d="M100 92 Q90 72 105 55 Q118 38 102 22" fill="none" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
  <path d="M150 92 Q140 72 155 55 Q168 38 152 22" fill="none" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
  <path d="M200 92 Q190 72 205 55 Q218 38 202 22" fill="none" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>
</svg>