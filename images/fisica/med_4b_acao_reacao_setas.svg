  <text x="116" y="130" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="bold">A</text>
  <rect x="153" y="85" width="62" height="70" rx="10" fill="#EA580C" stroke="#9A3412" stroke-width="4"/>
  <text x="184" y="130" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="bold">B</text>
  <!-- Opposite Equal Force Arrows -->
