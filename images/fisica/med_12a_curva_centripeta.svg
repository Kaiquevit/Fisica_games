<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Circular Track of Radius R -->
  <circle cx="150" cy="155" r="95" fill="none" stroke="#64748B" stroke-width="22" opacity="0.25"/>
  <circle cx="150" cy="155" r="95" fill="none" stroke="#2563EB" stroke-width="4" stroke-dasharray="8,8"/>
  <!-- Center point O -->
  <circle cx="150" cy="155" r="7" fill="#1E293B"/>
  <!-- Centripetal Force Vector Fcp pointing from object to center (Red) -->
  <path d="M150 60 L150 138 M140 124 L150 140 L160 124" stroke="#DC2626" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Tangential Velocity Vector v (Green) -->
  <path d="M150 60 L235 60 M220 50 L237 60 L220 70" stroke="#16A34A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Moving Object at top of circle -->
  <circle cx="150" cy="60" r="16" fill="#F97316" stroke="#FFFFFF" stroke-width="3"/>
</svg>