<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Closed circuit wire loop -->
  <rect x="55" y="75" width="190" height="150" rx="25" fill="none" stroke="#DC2626" stroke-width="8"/>
  <!-- Electron flow arrows along wire -->
  <polygon points="155,65 175,75 155,85" fill="#F59E0B"/>
  <polygon points="145,215 125,225 145,235" fill="#F59E0B"/>
  <!-- glowing electron dots on wire -->
  <circle cx="110" cy="75" r="7" fill="#38BDF8"/>
  <circle cx="200" cy="75" r="7" fill="#38BDF8"/>
  <circle cx="245" cy="150" r="7" fill="#38BDF8"/>
  <circle cx="185" cy="225" r="7" fill="#38BDF8"/>
  <!-- Battery cylinder on the left -->
  <rect x="30" y="105" width="52" height="95" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
  <!-- Battery positive gold top -->
  <rect x="30" y="105" width="52" height="32" rx="6" fill="#F59E0B"/>
  <!-- Battery terminal bump -->
  <rect x="46" y="95" width="20" height="10" rx="3" fill="#94A3B8"/>
  <!-- Plus & Minus symbols (pure geometric shapes, no text font dependency) -->
  <line x1="48" y1="121" x2="64" y2="121" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="56" y1="113" x2="56" y2="129" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="48" y1="175" x2="64" y2="175" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
</svg>