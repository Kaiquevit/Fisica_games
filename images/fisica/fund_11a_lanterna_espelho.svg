<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <circle cx="150" cy="150" r="120" fill="#1E293B"/>
  <!-- Flat Mirror at bottom -->
  <rect x="55" y="215" width="190" height="14" rx="4" fill="#38BDF8" stroke="#BAE6FD" stroke-width="3"/>
  <!-- Normal dashed line -->
  <line x1="150" y1="85" x2="150" y2="215" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6,6"/>
  <!-- Incident Light Beam from top-left -->
  <line x1="65" y1="95" x2="150" y2="215" stroke="#FACC15" stroke-width="8" stroke-linecap="round"/>
  <!-- Reflected Light Beam to top-right -->
  <line x1="150" y1="215" x2="235" y2="95" stroke="#FACC15" stroke-width="8" stroke-linecap="round"/>
  <polygon points="240,88 222,96 236,108" fill="#FACC15"/>
</svg>