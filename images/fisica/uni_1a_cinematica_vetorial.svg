<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Coordinate Axes -->
  <line x1="40" y1="255" x2="270" y2="255" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="40" y1="255" x2="40" y2="30" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <polygon points="270,255 258,249 258,261" fill="#475569"/>
  <polygon points="40,30 34,42 46,42" fill="#475569"/>
  <!-- 2D Curved Trajectory -->
  <path d="M 55 230 Q 120 75 255 125" fill="none" stroke="#94A3B8" stroke-width="4" stroke-dasharray="7,7"/>
  <!-- Position Vector r(t) from origin to particle (Blue) -->
  <line x1="40" y1="255" x2="145" y2="128" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <polygon points="148,124 134,131 143,139" fill="#2563EB"/>
  <!-- Tangent Velocity Vector v(t) (Green) -->
  <line x1="145" y1="128" x2="232" y2="85" stroke="#16A34A" stroke-width="6" stroke-linecap="round"/>
  <polygon points="238,82 222,82 228,94" fill="#16A34A"/>
  <!-- Centripetal/Total Acceleration Vector a(t) pointing inward (Red) -->
  <line x1="145" y1="128" x2="188" y2="195" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
  <polygon points="192,201 180,192 191,185" fill="#DC2626"/>
  <!-- Particle point P -->
  <circle cx="145" cy="128" r="10" fill="#F97316" stroke="#FFFFFF" stroke-width="3"/>
</svg>