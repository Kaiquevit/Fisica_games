<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Cylinder / Disk top & body -->
  <path d="M75 125 L75 195 A75 28 0 0 0 225 195 L225 125 Z" fill="#93C5FD" stroke="#1D4ED8" stroke-width="4"/>
  <ellipse cx="150" cy="125" rx="75" ry="28" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="4"/>
  <!-- Central Axis through CM (Blue) -->
  <line x1="150" y1="35" x2="150" y2="265" stroke="#2563EB" stroke-width="5" stroke-dasharray="8,6"/>
  <circle cx="150" cy="125" r="6" fill="#2563EB"/>
  <!-- Parallel Shifted Axis at distance d (Orange) -->
  <line x1="210" y1="35" x2="210" y2="265" stroke="#EA580C" stroke-width="5"/>
  <circle cx="210" cy="125" r="6" fill="#EA580C"/>
  <!-- Distance d double arrow between parallel axes -->
  <path d="M152 75 L208 75 M162 68 L150 75 L162 82 M198 68 L210 75 L198 82" stroke="#16A34A" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>