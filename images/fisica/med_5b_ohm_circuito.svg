<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240">
  <rect width="300" height="240" rx="18" fill="#FAF8F5"/>
  <!-- Ohm's Triangle U / (R * i) visual -->
  <polygon points="150,28 55,205 245,205" fill="#FFF7ED" stroke="#EA580C" stroke-width="6" stroke-linejoin="round"/>
  <line x1="102" y1="118" x2="198" y2="118" stroke="#EA580C" stroke-width="5"/>
  <line x1="150" y1="118" x2="150" y2="205" stroke="#EA580C" stroke-width="5"/>
  <text x="150" y="98" text-anchor="middle" fill="#2563EB" font-size="36" font-weight="bold">U</text>
  <text x="115" y="178" text-anchor="middle" fill="#DC2626" font-size="34" font-weight="bold">R</text>
  <text x="185" y="178" text-anchor="middle" fill="#16A34A" font-size="34" font-weight="bold">i</text>
</svg>