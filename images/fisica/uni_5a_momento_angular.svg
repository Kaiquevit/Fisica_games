<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Vertical Angular Momentum Vector L (Orange arrow pointing straight up) -->
  <line x1="150" y1="255" x2="150" y2="38" stroke="#F97316" stroke-width="6" stroke-dasharray="8,6"/>
  <path d="M 150 95 L 150 35 M 136 52 L 150 33 L 164 52" stroke="#EA580C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Spinning Gyroscope / Rotating Disk -->
  <ellipse cx="150" cy="160" rx="95" ry="34" fill="#DBEAFE" stroke="#2563EB" stroke-width="5"/>
  <ellipse cx="150" cy="160" rx="52" ry="18" fill="#93C5FD" stroke="#1D4ED8" stroke-width="3"/>
  <circle cx="150" cy="160" r="10" fill="#1E293B"/>
  <!-- Angular velocity swirl arrows around disk -->
  <path d="M 85 215 Q 150 238 215 215" fill="none" stroke="#16A34A" stroke-width="6" stroke-linecap="round"/>
  <polygon points="222,212 206,208 212,223" fill="#16A34A"/>
</svg>