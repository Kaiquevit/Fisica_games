<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Top ring -->
  <circle cx="150" cy="36" r="16" fill="none" stroke="#D97706" stroke-width="7"/>
  <!-- Compass gold case -->
  <circle cx="150" cy="160" r="108" fill="#F59E0B" stroke="#B45309" stroke-width="6"/>
  <!-- Compass dial face -->
  <circle cx="150" cy="160" r="92" fill="#FFFBEB"/>
  <!-- Cardinal ticks -->
  <line x1="150" y1="74" x2="150" y2="92" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
  <line x1="150" y1="228" x2="150" y2="246" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="160" x2="82" y2="160" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
  <line x1="218" y1="160" x2="236" y2="160" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
  <!-- Subtle inner rose circle -->
  <circle cx="150" cy="160" r="55" fill="none" stroke="#FDE68A" stroke-width="3"/>
  <!-- Compass Needle pointing North (Red) and South (Blue) -->
  <g transform="rotate(18 150 160)">
    <!-- North half -->
    <polygon points="150,82 134,160 166,160" fill="#EF4444"/>
    <!-- South half -->
    <polygon points="150,238 134,160 166,160" fill="#2563EB"/>
    <!-- Center pin -->
    <circle cx="150" cy="160" r="11" fill="#FACC15" stroke="#78350F" stroke-width="3"/>
  </g>
</svg>