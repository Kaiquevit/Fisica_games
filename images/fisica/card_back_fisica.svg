<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" rx="18" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="272" height="372" rx="12" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8,6" opacity="0.5"/>
  <!-- Atom illustration in center -->
  <g transform="translate(150, 200)">
    <ellipse cx="0" cy="0" rx="82" ry="32" fill="none" stroke="#38BDF8" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="82" ry="32" fill="none" stroke="#60A5FA" stroke-width="4" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="82" ry="32" fill="none" stroke="#93C5FD" stroke-width="4" transform="rotate(-60)"/>
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="16" fill="#F97316"/>
    <circle cx="-4" cy="-4" r="5" fill="#FDE047"/>
    <!-- Electrons -->
    <circle cx="82" cy="0" r="7" fill="#FACC15"/>
    <circle cx="-41" cy="-71" r="7" fill="#FACC15"/>
    <circle cx="-41" cy="71" r="7" fill="#FACC15"/>
  </g>
</svg>