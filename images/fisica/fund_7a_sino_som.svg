<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Sound wave concentric arcs on left and right -->
  <path d="M55 110 A65 65 0 0 0 55 200" fill="none" stroke="#3B82F6" stroke-width="5" stroke-linecap="round"/>
  <path d="M35 90 A90 90 0 0 0 35 220" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" stroke-dasharray="6,6"/>
  <path d="M245 110 A65 65 0 0 1 245 200" fill="none" stroke="#3B82F6" stroke-width="5" stroke-linecap="round"/>
  <path d="M265 90 A90 90 0 0 1 265 220" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" stroke-dasharray="6,6"/>
  <!-- Golden Bell -->
  <circle cx="150" cy="65" r="14" fill="#D97706"/>
  <path d="M150 75 C105 75, 92 125, 82 195 L218 195 C208 125, 195 75, 150 75 Z" fill="#FACC15" stroke="#B45309" stroke-width="5" stroke-linejoin="round"/>
  <rect x="75" y="190" width="150" height="16" rx="8" fill="#F59E0B" stroke="#B45309" stroke-width="4"/>
  <!-- Clapper vibrating at bottom -->
  <circle cx="150" cy="218" r="16" fill="#B45309"/>
  <line x1="122" y1="222" x2="110" y2="228" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  <line x1="178" y1="222" x2="190" y2="228" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
</svg>