<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" rx="20" fill="#FAF8F5"/>
  <!-- Asphalt Track -->
  <rect x="20" y="210" width="260" height="44" rx="8" fill="#334155"/>
  <line x1="35" y1="232" x2="265" y2="232" stroke="#FACC15" stroke-width="5" stroke-dasharray="18,14"/>
  <!-- Speed motion trail lines behind car -->
  <line x1="25" y1="145" x2="95" y2="145" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <line x1="18" y1="168" x2="82" y2="168" stroke="#0284C7" stroke-width="8" stroke-linecap="round"/>
  <line x1="35" y1="190" x2="88" y2="190" stroke="#7DD3FC" stroke-width="5" stroke-linecap="round"/>
  <!-- Velocity/Acceleration vector arrow above car -->
  <path d="M105 90 L235 90 M218 76 L238 90 L218 104" stroke="#22C55E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Sports Car Body -->
  <path d="M88 192 L98 158 L138 132 L205 132 L242 158 L268 168 L268 195 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="4" stroke-linejoin="round"/>
  <!-- Car Windows -->
  <polygon points="142,138 198,138 225,158 115,158" fill="#BAE6FD"/>
  <!-- Wheels -->
  <circle cx="130" cy="195" r="22" fill="#1E293B" stroke="#94A3B8" stroke-width="5"/>
  <circle cx="130" cy="195" r="8" fill="#CBD5E1"/>
  <circle cx="228" cy="195" r="22" fill="#1E293B" stroke="#94A3B8" stroke-width="5"/>
  <circle cx="228" cy="195" r="8" fill="#CBD5E1"/>
</svg>